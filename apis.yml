aid: flowable-api
name: Flowable
description: >-
  Flowable connects systems, data, and people for faster and smarter process automation, drawing on a long heritage of
  open source BPM. Flowable provides a model-driven, low-code platform for end-to-end automation of BPMN, CMMN, and DMN
  processes, delivered through a programmatic Java Process Engine API and a packaged REST API. The Process Engine
  exposes RepositoryService, RuntimeService, TaskService, IdentityService, HistoryService, ManagementService,
  FormService, and DynamicBpmnService for managing process definitions, instances, tasks, history, and runtime behavior.
